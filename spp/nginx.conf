server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression untuk performa produksi
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Reverse Proxy untuk endpoint Backend REST API & Real-Time SSE
    location ~ ^/(api|auth|users|students|spp|bills|events|my|payments|receipts|reports|audit-logs|dashboard|settings|sse|scalar|openapi\.json|uploads)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Konfigurasi khusus untuk Server-Sent Events (SSE) agar streaming lancar tanpa buffering
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Single Page Application (SPA) - React Router Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control untuk aset statis (CSS, JS, gambar)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
